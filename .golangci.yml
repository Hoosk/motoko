version: "2"
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - funlen
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - maintidx
    - staticcheck
  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 120
      statements: 100
    gocyclo:
      min-complexity: 30
    gosec:
      severity: low
    govet:
      enable-all: true
    goconst:
      ignore-tests: true
    maintidx:
      threshold: 25
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Theme palettes are declarative data tables; literal repetition is the design.
      - path: internal/styles/palette.go
        linters:
          - dupl
    paths:
      - third_party$
      - builtin$
      - examples$
      - _test\.go$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - _test\.go$
